name: CI

on:
  push:
    branches: [main, production]
  pull_request:
    branches: [main, production, dish/2026-09-07-native-staging-public]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & Unit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Local native account host persistence
        run: npm run test:account-host

      - name: Install pinned synthetic browser test runtime
        run: |
          npm install --prefix /tmp/account-form-browser --ignore-scripts --no-audit --no-fund playwright@1.63.0
          /tmp/account-form-browser/node_modules/.bin/playwright install --with-deps chromium

      - name: Native account form browser regression
        env:
          PLAYWRIGHT_MODULE: /tmp/account-form-browser/node_modules/playwright/index.mjs
        run: node tests/native-access/account-form-browser.mjs

      - name: Validate native account bundle
        run: npx wrangler deploy --dry-run --config account/wrangler.staging.jsonc --outdir /tmp/native-account-bundle
